{% extends "core/base.html" %}
{% block title %}Professor Roster{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Professor Roster</h1>
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th><a href="?sort=name">Name</a></th>
            <th><a href="?sort=dept">Department</a></th>
            <th><a href="?sort=salary">Salary</a></th>
        </tr>
    </thead>
    <tbody>
        {% for prof in professors %}
        <tr>
            <td>{{ prof.name }}</td>
            <td>{{ prof.department.name }}</td>
            <td>{{ prof.salary }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No professors found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
