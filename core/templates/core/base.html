<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}University Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'dashboard' %}">UMS</a>
        <div class="ms-auto">
            <span class="text-light me-3">{{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Log out</a>
        </div>
    </nav>
    {% endif %}
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
